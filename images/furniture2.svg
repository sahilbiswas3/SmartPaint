<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Kitchen outline -->
  <g transform="translate(50, 50)">
    <!-- Room structure -->
    <rect x="0" y="0" width="500" height="300" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
    
    <!-- Floor -->
    <rect x="0" y="250" width="500" height="50" fill="#e0e0e0" />
    
    <!-- Wall -->
    <rect x="0" y="0" width="500" height="250" fill="#f5f5f5" />
    
    <!-- Modular kitchen cabinets - lower units -->
    <g transform="translate(50, 200)">
      <!-- Base cabinets -->
      <rect x="0" y="0" width="400" height="50" fill="#8D6E63" stroke="#6D4C41" stroke-width="1" />
      
      <!-- Cabinet doors -->
      <rect x="10" y="5" width="40" height="40" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="60" y="5" width="40" height="40" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="110" y="5" width="40" height="40" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="160" y="5" width="80" height="40" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="250" y="5" width="40" height="40" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="300" y="5" width="40" height="40" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="350" y="5" width="40" height="40" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      
      <!-- Handles -->
      <rect x="25" y="25" width="10" height="2" fill="#9E9E9E" />
      <rect x="75" y="25" width="10" height="2" fill="#9E9E9E" />
      <rect x="125" y="25" width="10" height="2" fill="#9E9E9E" />
      <rect x="195" y="25" width="10" height="2" fill="#9E9E9E" />
      <rect x="265" y="25" width="10" height="2" fill="#9E9E9E" />
      <rect x="315" y="25" width="10" height="2" fill="#9E9E9E" />
      <rect x="365" y="25" width="10" height="2" fill="#9E9E9E" />
      
      <!-- Countertop -->
      <rect x="-5" y="-5" width="410" height="10" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" />
    </g>
    
    <!-- Modular kitchen cabinets - upper units -->
    <g transform="translate(50, 50)">
      <!-- Upper cabinets -->
      <rect x="0" y="0" width="400" height="80" fill="#8D6E63" stroke="#6D4C41" stroke-width="1" />
      
      <!-- Cabinet doors -->
      <rect x="10" y="5" width="40" height="70" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="60" y="5" width="40" height="70" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="110" y="5" width="40" height="70" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="160" y="5" width="80" height="70" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="250" y="5" width="40" height="70" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="300" y="5" width="40" height="70" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      <rect x="350" y="5" width="40" height="70" fill="#A1887F" stroke="#6D4C41" stroke-width="1" rx="2" ry="2" />
      
      <!-- Handles -->
      <rect x="25" y="40" width="10" height="2" fill="#9E9E9E" />
      <rect x="75" y="40" width="10" height="2" fill="#9E9E9E" />
      <rect x="125" y="40" width="10" height="2" fill="#9E9E9E" />
      <rect x="195" y="40" width="10" height="2" fill="#9E9E9E" />
      <rect x="265" y="40" width="10" height="2" fill="#9E9E9E" />
      <rect x="315" y="40" width="10" height="2" fill="#9E9E9E" />
      <rect x="365" y="40" width="10" height="2" fill="#9E9E9E" />
    </g>
    
    <!-- Kitchen appliances -->
    <g transform="translate(50, 200)">
      <!-- Sink -->
      <rect x="170" y="-15" width="60" height="40" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1" rx="5" ry="5" />
      <circle cx="200" cy="5" r="5" fill="#9E9E9E" />
      
      <!-- Stove -->
      <rect x="250" y="-15" width="80" height="40" fill="#424242" stroke="#212121" stroke-width="1" />
      <circle cx="270" cy="5" r="10" fill="#757575" stroke="#616161" stroke-width="1" />
      <circle cx="310" cy="5" r="10" fill="#757575" stroke="#616161" stroke-width="1" />
    </g>
    
    <!-- Carpenter working -->
    <g transform="translate(150, 150)">
      <!-- Person -->
      <circle cx="0" cy="0" r="15" fill="#333333" />
      <rect x="-10" y="15" width="20" height="30" fill="#333333" />
      <rect x="-20" y="20" width="10" height="5" fill="#333333" />
      <rect x="10" y="20" width="10" height="5" fill="#333333" />
      <rect x="-10" y="45" width="8" height="20" fill="#333333" />
      <rect x="2" y="45" width="8" height="20" fill="#333333" />
      
      <!-- Tools -->
      <rect x="-30" y="20" width="10" height="3" fill="#9E9E9E" />
      <rect x="20" y="20" width="15" height="2" fill="#9E9E9E" />
    </g>
    
    <!-- Measuring tape and tools -->
    <g transform="translate(350, 150)">
      <rect x="0" y="0" width="20" height="20" fill="#FFC107" stroke="#FFA000" stroke-width="1" />
      <line x1="0" y1="10" x2="20" y2="10" stroke="#212121" stroke-width="1" />
      <line x1="10" y1="0" x2="10" y2="20" stroke="#212121" stroke-width="1" />
      
      <rect x="30" y="0" width="30" height="5" fill="#9E9E9E" stroke="#757575" stroke-width="1" />
      <rect x="30" y="15" width="20" height="10" fill="#795548" stroke="#5D4037" stroke-width="1" />
    </g>
  </g>
  
  <!-- Project label -->
  <rect x="50" y="360" width="500" height="30" fill="#0077B6" />
  <text x="300" y="382" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Modular Kitchen Installation</text>
</svg>