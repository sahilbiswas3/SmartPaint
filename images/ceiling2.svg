<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Room structure -->
  <rect x="50" y="50" width="500" height="300" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
  
  <!-- Decorative POP ceiling design -->
  <g transform="translate(300, 100)">
    <!-- Main ceiling -->
    <rect x="-250" y="-50" width="500" height="10" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" />
    
    <!-- Decorative POP border -->
    <path d="M-200,-50 L-200,-40 L200,-40 L200,-50 Z" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
    <path d="M-180,-40 C-150,-60 -100,-60 -50,-40 C0,-60 50,-60 100,-40 C150,-60 180,-60 180,-40 Z" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
    
    <!-- Central decorative element -->
    <circle cx="0" cy="-40" r="80" fill="none" stroke="#ffffff" stroke-width="10" />
    <circle cx="0" cy="-40" r="70" fill="none" stroke="#f5f5f5" stroke-width="5" />
    <circle cx="0" cy="-40" r="60" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
    
    <!-- Traditional motifs -->
    <g transform="translate(0, -40)">
      <!-- Floral pattern -->
      <path d="M0,0 C10,-10 20,-10 30,0 C20,10 10,10 0,0 Z" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" />
      <path d="M0,0 C-10,-10 -20,-10 -30,0 C-20,10 -10,10 0,0 Z" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" />
      <path d="M0,0 C10,10 20,10 30,0 C20,-10 10,-10 0,0 Z" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" />
      <path d="M0,0 C-10,10 -20,10 -30,0 C-20,-10 -10,-10 0,0 Z" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" />
      
      <!-- Center element -->
      <circle cx="0" cy="0" r="10" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
      <circle cx="0" cy="0" r="5" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" />
    </g>
    
    <!-- Corner decorative elements -->
    <g>
      <path d="M-200,-50 C-220,-70 -220,-70 -240,-50 Z" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
      <path d="M200,-50 C220,-70 220,-70 240,-50 Z" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
    </g>
    
    <!-- Recessed lighting -->
    <circle cx="-100" cy="-40" r="10" fill="#FFEB3B" opacity="0.8" />
    <circle cx="100" cy="-40" r="10" fill="#FFEB3B" opacity="0.8" />
    <circle cx="0" cy="-100" r="10" fill="#FFEB3B" opacity="0.8" />
    <circle cx="0" cy="20" r="10" fill="#FFEB3B" opacity="0.8" />
  </g>
  
  <!-- Craftsman on ladder -->
  <g transform="translate(150, 250)">
    <!-- Ladder -->
    <rect x="-20" y="-150" width="5" height="150" fill="#8D6E63" />
    <rect x="15" y="-150" width="5" height="150" fill="#8D6E63" />
    <!-- Ladder steps -->
    <rect x="-20" y="-130" width="40" height="3" fill="#8D6E63" />
    <rect x="-20" y="-110" width="40" height="3" fill="#8D6E63" />
    <rect x="-20" y="-90" width="40" height="3" fill="#8D6E63" />
    <rect x="-20" y="-70" width="40" height="3" fill="#8D6E63" />
    <rect x="-20" y="-50" width="40" height="3" fill="#8D6E63" />
    <rect x="-20" y="-30" width="40" height="3" fill="#8D6E63" />
    
    <!-- Craftsman -->
    <g transform="translate(0, -120)">
      <!-- Head -->
      <circle cx="0" cy="0" r="10" fill="#333333" />
      <!-- Body -->
      <rect x="-7" y="10" width="14" height="25" fill="#333333" />
      <!-- Arms -->
      <rect x="-20" y="15" width="13" height="5" fill="#333333" />
      <rect x="7" y="15" width="23" height="5" fill="#333333" />
      <!-- Legs -->
      <rect x="-7" y="35" width="5" height="20" fill="#333333" />
      <rect x="2" y="35" width="5" height="20" fill="#333333" />
      <!-- Tool -->
      <rect x="30" y="15" width="15" height="3" fill="#cccccc" />
    </g>
  </g>
  
  <!-- POP material and tools -->
  <g transform="translate(400, 300)">
    <!-- POP bags -->
    <rect x="-30" y="-40" width="20" height="30" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" />
    <rect x="-25" y="-35" width="10" height="5" fill="#cccccc" />
    <rect x="0" y="-35" width="20" height="25" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" />
    
    <!-- Tools -->
    <rect x="30" y="-30" width="30" height="5" fill="#9E9E9E" stroke="#757575" stroke-width="1" />
    <rect x="30" y="-20" width="20" height="10" fill="#9E9E9E" stroke="#757575" stroke-width="1" />
    <rect x="30" y="-5" width="15" height="15" fill="#9E9E9E" stroke="#757575" stroke-width="1" />
    
    <!-- Mixing tray -->
    <rect x="-40" y="0" width="40" height="5" fill="#9E9E9E" stroke="#757575" stroke-width="1" />
    <path d="M-40,0 C-30,-10 -10,-10 0,0 Z" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" />
  </g>
  
  <!-- Project label -->
  <rect x="50" y="360" width="500" height="30" fill="#0077B6" />
  <text x="300" y="382" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Decorative POP Ceiling with Traditional Motifs</text>
</svg>