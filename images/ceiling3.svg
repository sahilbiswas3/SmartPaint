<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Home theater room with acoustic ceiling -->
  <g transform="translate(50, 50)">
    <!-- Room outline -->
    <rect x="0" y="0" width="500" height="300" fill="#212121" stroke="#000000" stroke-width="2" />
    
    <!-- Floor -->
    <rect x="0" y="250" width="500" height="50" fill="#3e2723" />
    
    <!-- Acoustic ceiling panels -->
    <g>
      <!-- Row 1 -->
      <rect x="20" y="20" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
      <rect x="110" y="20" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
      <rect x="200" y="20" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
      <rect x="290" y="20" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
      <rect x="380" y="20" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
      
      <!-- Row 2 -->
      <rect x="20" y="110" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
      <rect x="110" y="110" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
      <rect x="200" y="110" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
      <rect x="290" y="110" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
      <rect x="380" y="110" width="80" height="80" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" />
    </g>
    
    <!-- Acoustic panel patterns -->
    <g>
      <!-- Panel 1 patterns -->
      <g transform="translate(20, 20)">
        <circle cx="20" cy="20" r="3" fill="#616161" />
        <circle cx="40" cy="20" r="3" fill="#616161" />
        <circle cx="60" cy="20" r="3" fill="#616161" />
        <circle cx="20" cy="40" r="3" fill="#616161" />
        <circle cx="40" cy="40" r="3" fill="#616161" />
        <circle cx="60" cy="40" r="3" fill="#616161" />
        <circle cx="20" cy="60" r="3" fill="#616161" />
        <circle cx="40" cy="60" r="3" fill="#616161" />
        <circle cx="60" cy="60" r="3" fill="#616161" />
      </g>
      
      <!-- Panel 2 patterns -->
      <g transform="translate(110, 20)">
        <line x1="10" y1="10" x2="70" y2="70" stroke="#616161" stroke-width="2" />
        <line x1="10" y1="70" x2="70" y2="10" stroke="#616161" stroke-width="2" />
        <line x1="40" y1="10" x2="40" y2="70" stroke="#616161" stroke-width="2" />
        <line x1="10" y1="40" x2="70" y2="40" stroke="#616161" stroke-width="2" />
      </g>
      
      <!-- Panel 3 patterns -->
      <g transform="translate(200, 20)">
        <rect x="10" y="10" width="15" height="15" fill="#616161" />
        <rect x="35" y="10" width="15" height="15" fill="#616161" />
        <rect x="60" y="10" width="15" height="15" fill="#616161" />
        <rect x="10" y="35" width="15" height="15" fill="#616161" />
        <rect x="35" y="35" width="15" height="15" fill="#616161" />
        <rect x="60" y="35" width="15" height="15" fill="#616161" />
        <rect x="10" y="60" width="15" height="15" fill="#616161" />
        <rect x="35" y="60" width="15" height="15" fill="#616161" />
        <rect x="60" y="60" width="15" height="15" fill="#616161" />
      </g>
      
      <!-- Panel 4 patterns -->
      <g transform="translate(290, 20)">
        <circle cx="20" cy="20" r="10" fill="#616161" />
        <circle cx="60" cy="20" r="10" fill="#616161" />
        <circle cx="20" cy="60" r="10" fill="#616161" />
        <circle cx="60" cy="60" r="10" fill="#616161" />
        <circle cx="40" cy="40" r="15" fill="#616161" />
      </g>
      
      <!-- Panel 5 patterns -->
      <g transform="translate(380, 20)">
        <polygon points="40,10 10,40 40,70 70,40" fill="#616161" />
        <circle cx="40" cy="40" r="10" fill="#424242" />
      </g>
      
      <!-- Panel 6 patterns -->
      <g transform="translate(20, 110)">
        <rect x="10" y="10" width="60" height="5" fill="#616161" />
        <rect x="10" y="25" width="60" height="5" fill="#616161" />
        <rect x="10" y="40" width="60" height="5" fill="#616161" />
        <rect x="10" y="55" width="60" height="5" fill="#616161" />
        <rect x="10" y="70" width="60" height="5" fill="#616161" />
      </g>
      
      <!-- Panel 7 patterns -->
      <g transform="translate(110, 110)">
        <rect x="10" y="10" width="5" height="60" fill="#616161" />
        <rect x="25" y="10" width="5" height="60" fill="#616161" />
        <rect x="40" y="10" width="5" height="60" fill="#616161" />
        <rect x="55" y="10" width="5" height="60" fill="#616161" />
        <rect x="70" y="10" width="5" height="60" fill="#616161" />
      </g>
      
      <!-- Panel 8 patterns -->
      <g transform="translate(200, 110)">
        <circle cx="40" cy="40" r="30" fill="none" stroke="#616161" stroke-width="2" />
        <circle cx="40" cy="40" r="20" fill="none" stroke="#616161" stroke-width="2" />
        <circle cx="40" cy="40" r="10" fill="none" stroke="#616161" stroke-width="2" />
      </g>
      
      <!-- Panel 9 patterns -->
      <g transform="translate(290, 110)">
        <rect x="10" y="10" width="60" height="60" fill="none" stroke="#616161" stroke-width="2" />
        <rect x="20" y="20" width="40" height="40" fill="none" stroke="#616161" stroke-width="2" />
        <rect x="30" y="30" width="20" height="20" fill="none" stroke="#616161" stroke-width="2" />
      </g>
      
      <!-- Panel 10 patterns -->
      <g transform="translate(380, 110)">
        <polygon points="10,40 40,10 70,40 40,70" fill="none" stroke="#616161" stroke-width="2" />
        <polygon points="25,40 40,25 55,40 40,55" fill="none" stroke="#616161" stroke-width="2" />
      </g>
    </g>
    
    <!-- Home theater elements -->
    <g>
      <!-- Screen -->
      <rect x="150" y="200" width="200" height="100" fill="#e0e0e0" />
      <rect x="160" y="210" width="180" height="80" fill="#000000" />
      
      <!-- Speakers -->
      <rect x="100" y="210" width="20" height="40" fill="#212121" stroke="#000000" stroke-width="1" />
      <rect x="380" y="210" width="20" height="40" fill="#212121" stroke="#000000" stroke-width="1" />
      <circle cx="110" cy="220" r="5" fill="#616161" />
      <circle cx="110" cy="240" r="5" fill="#616161" />
      <circle cx="390" cy="220" r="5" fill="#616161" />
      <circle cx="390" cy="240" r="5" fill="#616161" />
      
      <!-- Recessed lighting -->
      <circle cx="60" cy="60" r="10" fill="#ffd54f" opacity="0.7" />
      <circle cx="170" cy="60" r="10" fill="#ffd54f" opacity="0.7" />
      <circle cx="280" cy="60" r="10" fill="#ffd54f" opacity="0.7" />
      <circle cx="390" cy="60" r="10" fill="#ffd54f" opacity="0.7" />
      <circle cx="60" cy="150" r="10" fill="#ffd54f" opacity="0.7" />
      <circle cx="170" cy="150" r="10" fill="#ffd54f" opacity="0.7" />
      <circle cx="280" cy="150" r="10" fill="#ffd54f" opacity="0.7" />
      <circle cx="390" cy="150" r="10" fill="#ffd54f" opacity="0.7" />
    </g>
    
    <!-- Installer with acoustic panels -->
    <g transform="translate(50, 200)">
      <!-- Person -->
      <circle cx="0" cy="0" r="15" fill="#333333" />
      <rect x="-10" y="15" width="20" height="30" fill="#333333" />
      <rect x="-20" y="20" width="10" height="20" fill="#333333" />
      <rect x="10" y="20" width="10" height="20" fill="#333333" />
      <rect x="-10" y="45" width="8" height="20" fill="#333333" />
      <rect x="2" y="45" width="8" height="20" fill="#333333" />
      
      <!-- Acoustic panel being installed -->
      <rect x="-30" y="-20" width="40" height="40" fill="#424242" stroke="#212121" stroke-width="1" rx="5" ry="5" transform="rotate(-15,-30,-20)" />
    </g>
    
    <!-- Sound wave visualization -->
    <g transform="translate(400, 180)">
      <path d="M0,0 C10,-10 20,10 30,0 C40,-10 50,10 60,0" stroke="#ffd54f" stroke-width="2" fill="none" />
      <path d="M0,15 C15,0 30,30 45,15 C60,0 75,30 90,15" stroke="#ffd54f" stroke-width="2" fill="none" />
    </g>
  </g>
  
  <!-- Project label -->
  <rect x="50" y="360" width="500" height="30" fill="#0077B6" />
  <text x="300" y="382" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Acoustic Ceiling Installation for Home Theater</text>
</svg>