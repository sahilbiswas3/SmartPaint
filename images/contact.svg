<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Decorative elements -->
  <g transform="translate(0, 0)">
    <!-- Left side decorative pattern -->
    <rect x="20" y="20" width="10" height="360" fill="#0077B6" opacity="0.7" />
    <rect x="40" y="40" width="5" height="320" fill="#00B4D8" opacity="0.5" />
    
    <!-- Right side decorative pattern -->
    <rect x="570" y="20" width="10" height="360" fill="#0077B6" opacity="0.7" />
    <rect x="555" y="40" width="5" height="320" fill="#00B4D8" opacity="0.5" />
    
    <!-- Top decorative elements -->
    <circle cx="100" cy="30" r="15" fill="#00B4D8" opacity="0.3" />
    <circle cx="150" cy="50" r="10" fill="#0077B6" opacity="0.2" />
    <circle cx="500" cy="30" r="15" fill="#00B4D8" opacity="0.3" />
    <circle cx="450" cy="50" r="10" fill="#0077B6" opacity="0.2" />
  </g>
  
  <!-- Customer service representative -->
  <g transform="translate(150, 150)">
    <!-- Person -->
    <circle cx="0" cy="0" r="40" fill="#0077B6" />
    <rect x="-30" y="40" width="60" height="80" fill="#0077B6" rx="5" ry="5" />
    
    <!-- Headset -->
    <path d="M-30,-10 Q-50,-10 -50,10 V30 Q-50,40 -40,40 H-30 V10 Q-30,0 -20,0" fill="#ffffff" />
    <path d="M30,-10 Q50,-10 50,10 V30 Q50,40 40,40 H30 V10 Q30,0 20,0" fill="#ffffff" />
    <rect x="-30" y="-10" width="60" height="10" fill="#ffffff" rx="5" ry="5" />
    
    <!-- Face features -->
    <circle cx="-15" cy="-5" r="5" fill="#ffffff" />
    <circle cx="15" cy="-5" r="5" fill="#ffffff" />
    <path d="M-10,15 Q0,25 10,15" stroke="#ffffff" stroke-width="3" fill="none" />
  </g>
  
  <!-- Contact icons -->
  <g transform="translate(350, 120)">
    <!-- Phone icon -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="25" fill="#00B4D8" />
      <path d="M-10,-10 H-5 Q0,-10 0,-5 V5 Q0,10 -5,10 H-10 Q-15,10 -15,5 V-5 Q-15,-10 -10,-10 Z" fill="#ffffff" />
      <path d="M5,-10 H10 Q15,-10 15,-5 V5 Q15,10 10,10 H5 V-10 Z" fill="#ffffff" />
      <rect x="-5" y="-10" width="10" height="20" fill="#ffffff" />
    </g>
    
    <!-- Email icon -->
    <g transform="translate(0, 70)">
      <circle cx="0" cy="0" r="25" fill="#00B4D8" />
      <rect x="-15" y="-10" width="30" height="20" fill="#ffffff" rx="2" ry="2" />
      <path d="M-15,-10 L0,0 L15,-10" stroke="#00B4D8" stroke-width="2" fill="none" />
      <path d="M-15,10 L0,0 L15,10" stroke="#00B4D8" stroke-width="2" fill="none" />
    </g>
    
    <!-- Location icon -->
    <g transform="translate(0, 140)">
      <circle cx="0" cy="0" r="25" fill="#00B4D8" />
      <path d="M0,-15 Q-15,-15 -15,0 Q-15,15 0,25 Q15,15 15,0 Q15,-15 0,-15 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="5" fill="#00B4D8" />
    </g>
  </g>
  
  <!-- Contact form representation -->
  <g transform="translate(450, 200)">
    <!-- Form background -->
    <rect x="-100" y="-80" width="200" height="160" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="5" ry="5" />
    
    <!-- Form fields -->
    <rect x="-80" y="-60" width="160" height="25" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" rx="3" ry="3" />
    <text x="-75" y="-43" font-family="Arial" font-size="10" fill="#999999">Name</text>
    
    <rect x="-80" y="-25" width="160" height="25" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" rx="3" ry="3" />
    <text x="-75" y="-8" font-family="Arial" font-size="10" fill="#999999">Email</text>
    
    <rect x="-80" y="10" width="160" height="40" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" rx="3" ry="3" />
    <text x="-75" y="27" font-family="Arial" font-size="10" fill="#999999">Message</text>
    
    <!-- Submit button -->
    <rect x="-40" y="60" width="80" height="30" fill="#0077B6" rx="5" ry="5" />
    <text x="0" y="78" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">SUBMIT</text>
  </g>
  
  <!-- Title -->
  <text x="300" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="#0077B6" text-anchor="middle">Get In Touch With Us</text>
  <text x="300" y="75" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">We're ready to bring your vision to life</text>
</svg>