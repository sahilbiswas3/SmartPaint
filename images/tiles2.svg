<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Bathroom structure -->
  <g transform="translate(50, 50)">
    <!-- Room outline -->
    <rect x="0" y="0" width="500" height="300" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
    
    <!-- Floor with modern tile pattern -->
    <g transform="translate(0, 200)">
      <!-- Base floor -->
      <rect width="500" height="100" fill="#f5f5f5" />
      
      <!-- Modern tile pattern -->
      <g>
        <!-- Herringbone pattern -->
        <g transform="translate(50, 20)">
          <!-- Row 1 -->
          <polygon points="0,0 20,20 0,40 -20,20" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
          <polygon points="0,40 20,20 40,40 20,60" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          <polygon points="40,40 60,20 80,40 60,60" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
          <polygon points="80,40 100,20 120,40 100,60" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          <polygon points="120,40 140,20 160,40 140,60" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
          <polygon points="160,40 180,20 200,40 180,60" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          <polygon points="200,40 220,20 240,40 220,60" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
          <polygon points="240,40 260,20 280,40 260,60" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          <polygon points="280,40 300,20 320,40 300,60" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
          <polygon points="320,40 340,20 360,40 340,60" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          
          <!-- Row 2 -->
          <polygon points="0,40 20,60 0,80 -20,60" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          <polygon points="0,80 20,60 40,80 20,100" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
          <polygon points="40,80 60,60 80,80 60,100" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          <polygon points="80,80 100,60 120,80 100,100" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
          <polygon points="120,80 140,60 160,80 140,100" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          <polygon points="160,80 180,60 200,80 180,100" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
          <polygon points="200,80 220,60 240,80 220,100" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          <polygon points="240,80 260,60 280,80 260,100" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
          <polygon points="280,80 300,60 320,80 300,100" fill="#d0d0d0" stroke="#cccccc" stroke-width="1" />
          <polygon points="320,80 340,60 360,80 340,100" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
        </g>
      </g>
    </g>
    
    <!-- Walls with modern tile pattern -->
    <g>
      <!-- Left wall -->
      <rect x="0" y="0" width="200" height="200" fill="#ffffff" />
      
      <!-- Subway tile pattern on left wall -->
      <g transform="translate(10, 10)">
        <!-- Rows of subway tiles -->
        <g>
          <!-- Row 1 -->
          <rect x="0" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          <rect x="40" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          <rect x="80" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          <rect x="120" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          <rect x="160" y="0" width="20" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          
          <!-- Row 2 -->
          <rect x="0" y="20" width="20" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          <rect x="20" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          <rect x="60" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          <rect x="100" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          <rect x="140" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          
          <!-- Additional rows -->
          <g transform="translate(0, 40)">
            <!-- Row 3 -->
            <rect x="0" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="40" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="80" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="120" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="160" y="0" width="20" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            
            <!-- Row 4 -->
            <rect x="0" y="20" width="20" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="20" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="60" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="100" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="140" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          </g>
          
          <!-- Additional rows -->
          <g transform="translate(0, 80)">
            <!-- Row 5 -->
            <rect x="0" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="40" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="80" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="120" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="160" y="0" width="20" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            
            <!-- Row 6 -->
            <rect x="0" y="20" width="20" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="20" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="60" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="100" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="140" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          </g>
          
          <!-- Additional rows -->
          <g transform="translate(0, 120)">
            <!-- Row 7 -->
            <rect x="0" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="40" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="80" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="120" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="160" y="0" width="20" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            
            <!-- Row 8 -->
            <rect x="0" y="20" width="20" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="20" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="60" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="100" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="140" y="20" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          </g>
          
          <!-- Additional rows -->
          <g transform="translate(0, 160)">
            <!-- Row 9 -->
            <rect x="0" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="40" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="80" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="120" y="0" width="40" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
            <rect x="160" y="0" width="20" height="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="1" ry="1" />
          </g>
        </g>
      </g>
      
      <!-- Right wall -->
      <rect x="200" y="0" width="300" height="200" fill="#ffffff" />
      
      <!-- Accent pattern on right wall -->
      <g transform="translate(210, 10)">
        <!-- Hexagon tile pattern -->
        <g>
          <!-- Row 1 -->
          <polygon points="0,20 10,0 30,0 40,20 30,40 10,40" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="40,20 50,0 70,0 80,20 70,40 50,40" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="80,20 90,0 110,0 120,20 110,40 90,40" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="120,20 130,0 150,0 160,20 150,40 130,40" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="160,20 170,0 190,0 200,20 190,40 170,40" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="200,20 210,0 230,0 240,20 230,40 210,40" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="240,20 250,0 270,0 280,20 270,40 250,40" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          
          <!-- Row 2 -->
          <polygon points="20,60 30,40 50,40 60,60 50,80 30,80" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="60,60 70,40 90,40 100,60 90,80 70,80" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="100,60 110,40 130,40 140,60 130,80 110,80" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="140,60 150,40 170,40 180,60 170,80 150,80" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="180,60 190,40 210,40 220,60 210,80 190,80" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="220,60 230,40 250,40 260,60 250,80 230,80" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          
          <!-- Row 3 -->
          <polygon points="0,100 10,80 30,80 40,100 30,120 10,120" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="40,100 50,80 70,80 80,100 70,120 50,120" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="80,100 90,80 110,80 120,100 110,120 90,120" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="120,100 130,80 150,80 160,100 150,120 130,120" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="160,100 170,80 190,80 200,100 190,120 170,120" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="200,100 210,80 230,80 240,100 230,120 210,120" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="240,100 250,80 270,80 280,100 270,120 250,120" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          
          <!-- Row 4 -->
          <polygon points="20,140 30,120 50,120 60,140 50,160 30,160" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="60,140 70,120 90,120 100,140 90,160 70,160" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="100,140 110,120 130,120 140,140 130,160 110,160" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="140,140 150,120 170,120 180,140 170,160 150,160" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="180,140 190,120 210,120 220,140 210,160 190,160" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
          <polygon points="220,140 230,120 250,120 260,140 250,160 230,160" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="1" />
        </g>
      </g>
    </g>
    
    <!-- Bathroom fixtures -->
    <g>
      <!-- Shower -->
      <rect x="350" y="50" width="100" height="100" fill="none" stroke="#cccccc" stroke-width="2" />
      <line x1="350" y1="50" x2="450" y2="50" stroke="#9E9E9E" stroke-width="3" />
      <circle cx="400" cy="80" r="15" fill="#9E9E9E" />
      
      <!-- Sink -->
      <rect x="250" y="100" width="60" height="40" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" rx="5" ry="5" />
      <circle cx="280" cy="120" r="10" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" />
      <rect x="275" y="100" width="10" height="5" fill="#9E9E9E" />
    </g>
    
    <!-- Tile installer -->
    <g transform="translate(150, 150)">
      <!-- Person -->
      <circle cx="0" cy="0" r="15" fill="#333333" />
      <rect x="-10" y="15" width="20" height="30" fill="#333333" />
      <rect x="-20" y="20" width="10" height="5" fill="#333333" />
      <rect x="10" y="20" width="10" height="5" fill="#333333" />
      <rect x="-10" y="45" width="8" height="20" fill="#333333" />
      <rect x="2" y="45" width="8" height="20" fill="#333333" />
      
      <!-- Tools -->
      <rect x="-30" y="20" width="10" height="3" fill="#9E9E9E" />
      <rect x="20" y="20" width="15" height="2" fill="#9E9E9E" />
    </g>
  </g>
  
  <!-- Project label -->
  <rect x="50" y="360" width="500" height="30" fill="#0077B6" />
  <text x="300" y="382" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Modern Bathroom Renovation with Waterproof Tiling</text>
</svg>