<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Room floor -->
  <rect x="50" y="200" width="500" height="150" fill="#d2b48c" />
  
  <!-- Wall -->
  <rect x="50" y="50" width="500" height="150" fill="#f5f5f5" />
  
  <!-- Modern sofa -->
  <g transform="translate(150, 250)">
    <!-- Sofa base -->
    <rect x="0" y="0" width="200" height="60" rx="5" fill="#0077B6" />
    <!-- Sofa back -->
    <rect x="0" y="-40" width="200" height="40" rx="5" fill="#0077B6" />
    <!-- Sofa arms -->
    <rect x="-20" y="-20" width="20" height="80" rx="5" fill="#0077B6" />
    <rect x="200" y="-20" width="20" height="80" rx="5" fill="#0077B6" />
    <!-- Sofa cushions -->
    <rect x="10" y="5" width="55" height="40" rx="5" fill="#00B4D8" />
    <rect x="75" y="5" width="55" height="40" rx="5" fill="#00B4D8" />
    <rect x="140" y="5" width="55" height="40" rx="5" fill="#00B4D8" />
    <!-- Sofa legs -->
    <rect x="20" y="60" width="10" height="15" fill="#333" />
    <rect x="170" y="60" width="10" height="15" fill="#333" />
  </g>
  
  <!-- Coffee table -->
  <g transform="translate(350, 290)">
    <!-- Table top -->
    <rect x="-60" y="-15" width="120" height="60" rx="2" fill="#8D6E63" />
    <!-- Table legs -->
    <rect x="-50" y="45" width="10" height="30" fill="#5D4037" />
    <rect x="40" y="45" width="10" height="30" fill="#5D4037" />
  </g>
  
  <!-- Decorative plant -->
  <g transform="translate(100, 150)">
    <!-- Pot -->
    <rect x="-15" y="30" width="30" height="30" rx="2" fill="#FFB6B9" />
    <!-- Plant -->
    <path d="M0,30 C-20,10 -10,-10 0,0 C10,-10 20,10 0,30" fill="#4CAF50" />
  </g>
  
  <!-- Carpenter silhouette -->
  <g transform="translate(450, 150)">
    <!-- Head -->
    <circle cx="0" cy="0" r="15" fill="#333333" />
    <!-- Body -->
    <rect x="-10" y="15" width="20" height="40" fill="#333333" />
    <!-- Arms -->
    <rect x="-30" y="20" width="20" height="8" fill="#333333" />
    <rect x="10" y="20" width="20" height="8" fill="#333333" />
    <!-- Legs -->
    <rect x="-10" y="55" width="8" height="30" fill="#333333" />
    <rect x="2" y="55" width="8" height="30" fill="#333333" />
    <!-- Tool -->
    <rect x="-40" y="20" width="15" height="5" fill="#8D6E63" />
  </g>
  
  <!-- Project label -->
  <rect x="50" y="360" width="500" height="30" fill="#0077B6" />
  <text x="300" y="382" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Custom Furniture Installation</text>
</svg>