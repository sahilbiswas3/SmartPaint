<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- House exterior -->
  <g transform="translate(50, 50)">
    <!-- House structure -->
    <rect x="100" y="50" width="300" height="200" fill="#f5f5f5" stroke="#cccccc" stroke-width="2" />
    
    <!-- Roof -->
    <polygon points="100,50 250,0 400,50" fill="#d32f2f" stroke="#b71c1c" stroke-width="2" />
    
    <!-- Door -->
    <rect x="220" y="170" width="60" height="80" fill="#795548" stroke="#5d4037" stroke-width="2" />
    <circle cx="265" cy="210" r="5" fill="#ffd700" />
    
    <!-- Windows -->
    <rect x="130" y="90" width="60" height="60" fill="#bbdefb" stroke="#1976d2" stroke-width="2" />
    <line x1="160" y1="90" x2="160" y2="150" stroke="#1976d2" stroke-width="2" />
    <line x1="130" y1="120" x2="190" y2="120" stroke="#1976d2" stroke-width="2" />
    
    <rect x="310" y="90" width="60" height="60" fill="#bbdefb" stroke="#1976d2" stroke-width="2" />
    <line x1="340" y1="90" x2="340" y2="150" stroke="#1976d2" stroke-width="2" />
    <line x1="310" y1="120" x2="370" y2="120" stroke="#1976d2" stroke-width="2" />
    
    <!-- Partially painted section -->
    <g>
      <!-- Left side - painted -->
      <rect x="100" y="50" width="150" height="200" fill="#e3f2fd" />
      
      <!-- Windows on painted side -->
      <rect x="130" y="90" width="60" height="60" fill="#bbdefb" stroke="#1976d2" stroke-width="2" />
      <line x1="160" y1="90" x2="160" y2="150" stroke="#1976d2" stroke-width="2" />
      <line x1="130" y1="120" x2="190" y2="120" stroke="#1976d2" stroke-width="2" />
    </g>
    
    <!-- Painter on ladder -->
    <g transform="translate(400, 150)">
      <!-- Ladder -->
      <line x1="0" y1="0" x2="-20" y2="100" stroke="#8d6e63" stroke-width="3" />
      <line x1="-20" y1="0" x2="-40" y2="100" stroke="#8d6e63" stroke-width="3" />
      <line x1="-20" y1="20" x2="-40" y2="20" stroke="#8d6e63" stroke-width="2" />
      <line x1="-19" y1="40" x2="-39" y2="40" stroke="#8d6e63" stroke-width="2" />
      <line x1="-18" y1="60" x2="-38" y2="60" stroke="#8d6e63" stroke-width="2" />
      <line x1="-17" y1="80" x2="-37" y2="80" stroke="#8d6e63" stroke-width="2" />
      
      <!-- Painter -->
      <circle cx="-10" cy="20" r="10" fill="#333333" />
      <rect x="-20" y="30" width="20" height="30" fill="#333333" />
      <rect x="-25" y="35" width="5" height="20" fill="#333333" />
      <rect x="0" y="35" width="20" height="5" fill="#333333" />
      <rect x="-20" y="60" width="8" height="20" fill="#333333" />
      <rect x="-8" y="60" width="8" height="20" fill="#333333" />
      
      <!-- Paint roller -->
      <rect x="0" y="35" width="30" height="5" fill="#9e9e9e" />
      <rect x="30" y="30" width="10" height="15" fill="#0077b6" />
    </g>
    
    <!-- Paint supplies -->
    <g transform="translate(420, 230)">
      <!-- Paint cans -->
      <circle cx="0" cy="0" r="15" fill="#0077b6" stroke="#005f8b" stroke-width="2" />
      <rect x="-15" y="-20" width="30" height="5" fill="#9e9e9e" />
      
      <circle cx="30" cy="0" r="10" fill="#4fc3f7" stroke="#29b6f6" stroke-width="2" />
      <rect x="20" y="-15" width="20" height="5" fill="#9e9e9e" />
      
      <!-- Paint tray -->
      <rect x="-20" y="20" width="40" height="20" fill="#9e9e9e" stroke="#757575" stroke-width="1" />
      <path d="M-20,20 L20,20 L10,30 L-10,30 Z" fill="#0077b6" />
    </g>
    
    <!-- Weather-resistant label -->
    <g transform="translate(50, 280)">
      <rect x="0" y="0" width="150" height="50" rx="5" ry="5" fill="#0077b6" />
      <text x="75" y="20" font-family="Arial" font-size="12" fill="white" text-anchor="middle">WEATHER-RESISTANT</text>
      <text x="75" y="35" font-family="Arial" font-size="12" fill="white" text-anchor="middle">EXTERIOR COATING</text>
    </g>
    
    <!-- 5-year warranty seal -->
    <g transform="translate(450, 50)">
      <circle cx="0" cy="0" r="30" fill="#ffd700" stroke="#ff8f00" stroke-width="2" />
      <text x="0" y="-5" font-family="Arial" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">5-YEAR</text>
      <text x="0" y="10" font-family="Arial" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">WARRANTY</text>
    </g>
  </g>
  
  <!-- Project label -->
  <rect x="50" y="360" width="500" height="30" fill="#0077B6" />
  <text x="300" y="382" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Exterior House Painting with Weather-Resistant Coating</text>
</svg>