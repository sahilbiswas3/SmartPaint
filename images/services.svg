<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Service Icons -->
  <g transform="translate(50, 50)">
    <!-- Painting Service -->
    <g transform="translate(0, 0)">
      <circle cx="75" cy="75" r="75" fill="#0077B6" opacity="0.1" />
      <circle cx="75" cy="75" r="65" fill="#0077B6" opacity="0.2" />
      
      <!-- Paint roller icon -->
      <g transform="translate(75, 75)">
        <!-- Roller handle -->
        <rect x="-10" y="-40" width="5" height="80" fill="#0077B6" />
        <rect x="-5" y="-40" width="15" height="5" fill="#0077B6" />
        
        <!-- Roller -->
        <rect x="10" y="-50" width="20" height="30" fill="#00B4D8" rx="10" ry="10" />
        <rect x="5" y="-50" width="5" height="30" fill="#0077B6" />
        
        <!-- Paint drips -->
        <path d="M15,-50 V-60 Q15,-65 20,-65 Q25,-65 25,-60 V-50" fill="#00B4D8" />
        <path d="M25,-50 V-55 Q25,-58 28,-58 Q31,-58 31,-55 V-50" fill="#00B4D8" />
        
        <!-- Paint tray -->
        <rect x="-40" y="30" width="60" height="10" fill="#0077B6" />
        <path d="M-40,30 L-30,20 L20,20 L20,30 Z" fill="#00B4D8" />
      </g>
      
      <!-- Service name -->
      <text x="75" y="170" font-family="Arial" font-size="18" font-weight="bold" fill="#0077B6" text-anchor="middle">Painting</text>
      <text x="75" y="190" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Interior & Exterior</text>
    </g>
    
    <!-- Furniture Service -->
    <g transform="translate(175, 0)">
      <circle cx="75" cy="75" r="75" fill="#0077B6" opacity="0.1" />
      <circle cx="75" cy="75" r="65" fill="#0077B6" opacity="0.2" />
      
      <!-- Furniture icon -->
      <g transform="translate(75, 75)">
        <!-- Chair -->
        <rect x="-30" y="-10" width="60" height="10" fill="#0077B6" rx="2" ry="2" />
        <rect x="-25" y="0" width="50" height="5" fill="#0077B6" />
        <rect x="-25" y="5" width="5" height="30" fill="#0077B6" />
        <rect x="20" y="5" width="5" height="30" fill="#0077B6" />
        <rect x="-15" y="-40" width="30" height="30" fill="#00B4D8" />
        <rect x="-15" y="-40" width="30" height="5" fill="#0077B6" />
        <rect x="-15" y="-40" width="5" height="30" fill="#0077B6" />
        <rect x="10" y="-40" width="5" height="30" fill="#0077B6" />
        
        <!-- Tools -->
        <rect x="-40" y="20" width="15" height="3" fill="#0077B6" />
        <rect x="-40" y="20" width="3" height="10" fill="#0077B6" />
        <rect x="30" y="-30" width="10" height="10" fill="#0077B6" />
      </g>
      
      <!-- Service name -->
      <text x="75" y="170" font-family="Arial" font-size="18" font-weight="bold" fill="#0077B6" text-anchor="middle">Furniture</text>
      <text x="75" y="190" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Custom & Repair</text>
    </g>
    
    <!-- False Ceiling Service -->
    <g transform="translate(350, 0)">
      <circle cx="75" cy="75" r="75" fill="#0077B6" opacity="0.1" />
      <circle cx="75" cy="75" r="65" fill="#0077B6" opacity="0.2" />
      
      <!-- Ceiling icon -->
      <g transform="translate(75, 75)">
        <!-- Room outline -->
        <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#0077B6" stroke-width="3" />
        
        <!-- False ceiling -->
        <rect x="-40" y="-40" width="80" height="20" fill="#00B4D8" opacity="0.5" />
        <path d="M-40,-20 L40,-20 L40,-25 L-40,-25 Z" fill="#0077B6" />
        
        <!-- Recessed lights -->
        <circle cx="-20" cy="-30" r="5" fill="#FFEB3B" opacity="0.8" />
        <circle cx="0" cy="-30" r="5" fill="#FFEB3B" opacity="0.8" />
        <circle cx="20" cy="-30" r="5" fill="#FFEB3B" opacity="0.8" />
        
        <!-- Decorative element -->
        <rect x="-30" y="-25" width="60" height="5" fill="#0077B6" />
      </g>
      
      <!-- Service name -->
      <text x="75" y="170" font-family="Arial" font-size="18" font-weight="bold" fill="#0077B6" text-anchor="middle">False Ceiling</text>
      <text x="75" y="190" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Modern Designs</text>
    </g>
    
    <!-- Marble Tiles Service -->
    <g transform="translate(525, 0)">
      <circle cx="75" cy="75" r="75" fill="#0077B6" opacity="0.1" />
      <circle cx="75" cy="75" r="65" fill="#0077B6" opacity="0.2" />
      
      <!-- Tiles icon -->
      <g transform="translate(75, 75)">
        <!-- Tile pattern -->
        <rect x="-40" y="-40" width="25" height="25" fill="#f5f5f5" stroke="#0077B6" stroke-width="2" />
        <rect x="-15" y="-40" width="25" height="25" fill="#00B4D8" opacity="0.3" stroke="#0077B6" stroke-width="2" />
        <rect x="10" y="-40" width="25" height="25" fill="#f5f5f5" stroke="#0077B6" stroke-width="2" />
        
        <rect x="-40" y="-15" width="25" height="25" fill="#00B4D8" opacity="0.3" stroke="#0077B6" stroke-width="2" />
        <rect x="-15" y="-15" width="25" height="25" fill="#f5f5f5" stroke="#0077B6" stroke-width="2" />
        <rect x="10" y="-15" width="25" height="25" fill="#00B4D8" opacity="0.3" stroke="#0077B6" stroke-width="2" />
        
        <rect x="-40" y="10" width="25" height="25" fill="#f5f5f5" stroke="#0077B6" stroke-width="2" />
        <rect x="-15" y="10" width="25" height="25" fill="#00B4D8" opacity="0.3" stroke="#0077B6" stroke-width="2" />
        <rect x="10" y="10" width="25" height="25" fill="#f5f5f5" stroke="#0077B6" stroke-width="2" />
        
        <!-- Marble veining effect -->
        <path d="M-35,-35 Q-25,-30 -30,-20" stroke="#0077B6" stroke-width="1" fill="none" />
        <path d="M-10,-35 Q0,-30 -5,-20" stroke="#0077B6" stroke-width="1" fill="none" />
        <path d="M15,-35 Q25,-30 20,-20" stroke="#0077B6" stroke-width="1" fill="none" />
        
        <path d="M-35,-10 Q-25,-5 -30,5" stroke="#0077B6" stroke-width="1" fill="none" />
        <path d="M-10,-10 Q0,-5 -5,5" stroke="#0077B6" stroke-width="1" fill="none" />
        <path d="M15,-10 Q25,-5 20,5" stroke="#0077B6" stroke-width="1" fill="none" />
        
        <path d="M-35,15 Q-25,20 -30,30" stroke="#0077B6" stroke-width="1" fill="none" />
        <path d="M-10,15 Q0,20 -5,30" stroke="#0077B6" stroke-width="1" fill="none" />
        <path d="M15,15 Q25,20 20,30" stroke="#0077B6" stroke-width="1" fill="none" />
      </g>
      
      <!-- Service name -->
      <text x="75" y="170" font-family="Arial" font-size="18" font-weight="bold" fill="#0077B6" text-anchor="middle">Marble Tiles</text>
      <text x="75" y="190" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Premium Quality</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="400" y="300" font-family="Arial" font-size="24" font-weight="bold" fill="#0077B6" text-anchor="middle">Our Professional Services</text>
  <text x="400" y="330" font-family="Arial" font-size="16" fill="#333333" text-anchor="middle">Quality craftsmanship for your home and office</text>
  
  <!-- Decorative elements -->
  <rect x="350" y="350" width="100" height="3" fill="#00B4D8" />
  <rect x="375" y="360" width="50" height="3" fill="#0077B6" />
</svg>