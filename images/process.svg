<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Process Steps -->
  <g transform="translate(50, 50)">
    <!-- Step 1: Consultation -->
    <g transform="translate(0, 0)">
      <circle cx="50" cy="50" r="50" fill="#0077B6" />
      <text x="50" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Step 1</text>
      <text x="50" y="65" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Consultation</text>
      
      <!-- Consultation icon -->
      <g transform="translate(50, 100) scale(0.7)">
        <!-- People talking -->
        <circle cx="-20" cy="0" r="15" fill="#ffffff" />
        <rect x="-30" y="15" width="20" height="25" fill="#ffffff" />
        
        <circle cx="20" cy="0" r="15" fill="#ffffff" />
        <rect x="10" y="15" width="20" height="25" fill="#ffffff" />
        
        <!-- Speech bubbles -->
        <path d="M-30,-10 Q-40,-20 -30,-30 H-10 Q0,-30 0,-20 V-15 Q0,-10 -5,-10 H-20 L-25,0 Z" fill="#ffffff" />
        <path d="M30,-10 Q40,-20 30,-30 H10 Q0,-30 0,-20 V-15 Q0,-10 5,-10 H20 L25,0 Z" fill="#ffffff" />
      </g>
    </g>
    
    <!-- Arrow 1 -->
    <g transform="translate(100, 50)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#00B4D8" stroke-width="3" />
      <polygon points="50,0 40,-5 40,5" fill="#00B4D8" />
    </g>
    
    <!-- Step 2: Design -->
    <g transform="translate(150, 0)">
      <circle cx="50" cy="50" r="50" fill="#0077B6" />
      <text x="50" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Step 2</text>
      <text x="50" y="65" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Design</text>
      
      <!-- Design icon -->
      <g transform="translate(50, 100) scale(0.7)">
        <!-- Drawing board -->
        <rect x="-25" y="-25" width="50" height="40" fill="#ffffff" />
        
        <!-- Design elements -->
        <line x1="-15" y1="-15" x2="15" y2="-15" stroke="#0077B6" stroke-width="2" />
        <line x1="-15" y1="-5" x2="5" y2="-5" stroke="#0077B6" stroke-width="2" />
        <rect x="-15" y="5" width="30" height="15" fill="none" stroke="#0077B6" stroke-width="2" />
        
        <!-- Pencil -->
        <line x1="-10" y1="25" x2="20" y2="-5" stroke="#ffffff" stroke-width="3" />
        <polygon points="22,-7 25,-4 19,-1" fill="#ffffff" />
      </g>
    </g>
    
    <!-- Arrow 2 -->
    <g transform="translate(250, 50)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#00B4D8" stroke-width="3" />
      <polygon points="50,0 40,-5 40,5" fill="#00B4D8" />
    </g>
    
    <!-- Step 3: Material Selection -->
    <g transform="translate(300, 0)">
      <circle cx="50" cy="50" r="50" fill="#0077B6" />
      <text x="50" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Step 3</text>
      <text x="50" y="65" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Materials</text>
      
      <!-- Materials icon -->
      <g transform="translate(50, 100) scale(0.7)">
        <!-- Paint can -->
        <rect x="-25" y="-20" width="20" height="30" fill="#ffffff" rx="2" ry="2" />
        <rect x="-27" y="-25" width="24" height="5" fill="#ffffff" rx="1" ry="1" />
        
        <!-- Tiles -->
        <rect x="5" y="-20" width="15" height="15" fill="#ffffff" stroke="#0077B6" stroke-width="1" />
        <rect x="20" y="-20" width="15" height="15" fill="#ffffff" stroke="#0077B6" stroke-width="1" />
        <rect x="5" y="-5" width="15" height="15" fill="#ffffff" stroke="#0077B6" stroke-width="1" />
        <rect x="20" y="-5" width="15" height="15" fill="#ffffff" stroke="#0077B6" stroke-width="1" />
      </g>
    </g>
    
    <!-- Arrow 3 -->
    <g transform="translate(400, 50)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#00B4D8" stroke-width="3" />
      <polygon points="50,0 40,-5 40,5" fill="#00B4D8" />
    </g>
    
    <!-- Step 4: Execution -->
    <g transform="translate(450, 0)">
      <circle cx="50" cy="50" r="50" fill="#0077B6" />
      <text x="50" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Step 4</text>
      <text x="50" y="65" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Execution</text>
      
      <!-- Execution icon -->
      <g transform="translate(50, 100) scale(0.7)">
        <!-- Worker -->
        <circle cx="0" cy="-15" r="15" fill="#ffffff" />
        <rect x="-10" y="0" width="20" height="25" fill="#ffffff" />
        <rect x="-20" y="5" width="10" height="5" fill="#ffffff" />
        <rect x="10" y="5" width="10" height="5" fill="#ffffff" />
        
        <!-- Tools -->
        <rect x="-30" y="5" width="10" height="3" fill="#ffffff" />
        <rect x="20" y="5" width="15" height="3" fill="#ffffff" />
      </g>
    </g>
    
    <!-- Arrow 4 -->
    <g transform="translate(550, 50)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#00B4D8" stroke-width="3" />
      <polygon points="50,0 40,-5 40,5" fill="#00B4D8" />
    </g>
    
    <!-- Step 5: Quality Check -->
    <g transform="translate(600, 0)">
      <circle cx="50" cy="50" r="50" fill="#0077B6" />
      <text x="50" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Step 5</text>
      <text x="50" y="65" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Quality Check</text>
      
      <!-- Quality check icon -->
      <g transform="translate(50, 100) scale(0.7)">
        <!-- Clipboard -->
        <rect x="-20" y="-25" width="40" height="50" fill="#ffffff" rx="3" ry="3" />
        <rect x="-15" y="-20" width="30" height="5" fill="none" stroke="#0077B6" stroke-width="1" />
        <rect x="-15" y="-10" width="30" height="5" fill="none" stroke="#0077B6" stroke-width="1" />
        <rect x="-15" y="0" width="30" height="5" fill="none" stroke="#0077B6" stroke-width="1" />
        <rect x="-15" y="10" width="30" height="5" fill="none" stroke="#0077B6" stroke-width="1" />
        
        <!-- Checkmark -->
        <path d="M-5,0 L0,5 L10,-5" stroke="#0077B6" stroke-width="2" fill="none" />
      </g>
    </g>
  </g>
  
  <!-- Process Description -->
  <g transform="translate(50, 250)">
    <text x="50" y="0" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Initial meeting</text>
    <text x="50" y="15" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">with client</text>
    
    <text x="200" y="0" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Creating custom</text>
    <text x="200" y="15" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">design plans</text>
    
    <text x="350" y="0" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Selecting quality</text>
    <text x="350" y="15" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">materials</text>
    
    <text x="500" y="0" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Professional</text>
    <text x="500" y="15" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">implementation</text>
    
    <text x="650" y="0" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Final inspection</text>
    <text x="650" y="15" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">& client approval</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="350" font-family="Arial" font-size="24" font-weight="bold" fill="#0077B6" text-anchor="middle">Our Process: From Concept to Completion</text>
</svg>