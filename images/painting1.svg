<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background wall -->
  <rect width="100%" height="100%" fill="#f5f5f5" />
  
  <!-- Room structure -->
  <rect x="50" y="50" width="500" height="300" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
  
  <!-- Half-painted wall effect -->
  <rect x="50" y="50" width="500" height="150" fill="#0077B6" />
  
  <!-- Painter silhouette -->
  <g transform="translate(150, 250)">
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#333333" />
    <!-- Body -->
    <rect x="-15" y="20" width="30" height="60" fill="#333333" />
    <!-- Arms -->
    <rect x="-40" y="30" width="25" height="10" fill="#333333" />
    <rect x="15" y="30" width="60" height="10" fill="#333333" />
    <!-- Legs -->
    <rect x="-15" y="80" width="10" height="40" fill="#333333" />
    <rect x="5" y="80" width="10" height="40" fill="#333333" />
    <!-- Paint roller -->
    <rect x="75" y="25" width="40" height="15" fill="#cccccc" />
    <rect x="115" y="20" width="10" height="25" fill="#999999" />
  </g>
  
  <!-- Paint can -->
  <g transform="translate(400, 320)">
    <rect x="-15" y="-30" width="30" height="30" fill="#00B4D8" stroke="#333333" stroke-width="2" />
    <rect x="-20" y="-35" width="40" height="5" fill="#999999" stroke="#333333" stroke-width="1" />
  </g>
  
  <!-- Paint drips -->
  <path d="M100,200 Q100,220 90,230" stroke="#0077B6" stroke-width="3" fill="none" />
  <path d="M200,200 Q200,230 190,240" stroke="#0077B6" stroke-width="3" fill="none" />
  <path d="M300,200 Q300,225 290,235" stroke="#0077B6" stroke-width="3" fill="none" />
  
  <!-- Project label -->
  <rect x="50" y="360" width="500" height="30" fill="#0077B6" />
  <text x="300" y="382" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Modern Living Room Painting Project</text>
</svg>