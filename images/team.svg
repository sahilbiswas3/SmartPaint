<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Team members silhouettes -->
  <!-- Person 1 -->
  <g transform="translate(150, 100)">
    <!-- Head -->
    <circle cx="0" cy="0" r="40" fill="#0077B6" />
    <!-- Body -->
    <path d="M-30,40 C-30,80 30,80 30,40" fill="#0077B6" />
    <!-- Text -->
    <text x="0" y="150" font-family="Arial" font-size="16" fill="#333" text-anchor="middle">Founder</text>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(300, 100)">
    <!-- Head -->
    <circle cx="0" cy="0" r="40" fill="#00B4D8" />
    <!-- Body -->
    <path d="M-30,40 C-30,80 30,80 30,40" fill="#00B4D8" />
    <!-- Text -->
    <text x="0" y="150" font-family="Arial" font-size="16" fill="#333" text-anchor="middle">Designer</text>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(450, 100)">
    <!-- Head -->
    <circle cx="0" cy="0" r="40" fill="#0077B6" />
    <!-- Body -->
    <path d="M-30,40 C-30,80 30,80 30,40" fill="#0077B6" />
    <!-- Text -->
    <text x="0" y="150" font-family="Arial" font-size="16" fill="#333" text-anchor="middle">Painter</text>
  </g>
  
  <!-- Person 4 -->
  <g transform="translate(600, 100)">
    <!-- Head -->
    <circle cx="0" cy="0" r="40" fill="#00B4D8" />
    <!-- Body -->
    <path d="M-30,40 C-30,80 30,80 30,40" fill="#00B4D8" />
    <!-- Text -->
    <text x="0" y="150" font-family="Arial" font-size="16" fill="#333" text-anchor="middle">Carpenter</text>
  </g>
  
  <!-- Company name -->
  <text x="400" y="250" font-family="Arial" font-size="24" font-weight="bold" fill="#0077B6" text-anchor="middle">Smart Painting Team</text>
  <text x="400" y="280" font-family="Arial" font-size="18" fill="#333" text-anchor="middle">Serving Kolkata since 1994</text>
  
  <!-- Decorative elements -->
  <rect x="150" y="320" width="500" height="5" fill="#FFB6B9" />
  <circle cx="150" cy="322.5" r="10" fill="#0077B6" />
  <circle cx="650" cy="322.5" r="10" fill="#0077B6" />
</svg>