<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Office space with walls -->
  <g transform="translate(50, 50)">
    <!-- Room structure -->
    <rect x="0" y="0" width="500" height="300" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
    
    <!-- Floor -->
    <rect x="0" y="250" width="500" height="50" fill="#e0e0e0" />
    
    <!-- Left wall -->
    <rect x="0" y="0" width="200" height="250" fill="#0077B6" />
    
    <!-- Right wall -->
    <rect x="200" y="0" width="300" height="250" fill="#f5f5f5" />
    
    <!-- Window -->
    <rect x="350" y="50" width="100" height="120" fill="#e6f7ff" stroke="#cccccc" stroke-width="2" />
    <line x1="400" y1="50" x2="400" y2="170" stroke="#cccccc" stroke-width="2" />
    <line x1="350" y1="110" x2="450" y2="110" stroke="#cccccc" stroke-width="2" />
    
    <!-- Desk -->
    <rect x="50" y="180" width="150" height="70" fill="#8D6E63" />
    <rect x="60" y="190" width="130" height="10" fill="#A1887F" />
    
    <!-- Office chair -->
    <rect x="100" y="200" width="40" height="5" fill="#424242" />
    <rect x="115" y="205" width="10" height="30" fill="#424242" />
    <rect x="105" y="235" width="30" height="5" fill="#424242" />
    
    <!-- Computer -->
    <rect x="80" y="160" width="40" height="30" fill="#424242" />
    <rect x="95" y="190" width="10" height="10" fill="#424242" />
    
    <!-- Painter with roller -->
    <g transform="translate(300, 150)">
      <!-- Painter -->
      <circle cx="0" cy="0" r="20" fill="#333333" />
      <rect x="-15" y="20" width="30" height="40" fill="#333333" />
      <rect x="-25" y="25" width="10" height="5" fill="#333333" />
      <rect x="15" y="25" width="10" height="5" fill="#333333" />
      <rect x="-10" y="60" width="8" height="20" fill="#333333" />
      <rect x="2" y="60" width="8" height="20" fill="#333333" />
      
      <!-- Paint roller -->
      <rect x="-40" y="25" width="5" height="40" fill="#666666" />
      <rect x="-55" y="15" width="15" height="10" fill="#00B4D8" rx="5" ry="5" />
    </g>
    
    <!-- Paint tray and supplies -->
    <g transform="translate(250, 250)">
      <rect x="0" y="0" width="40" height="10" fill="#A1887F" />
      <path d="M0,0 L10,-5 L40,-5 L40,0 Z" fill="#00B4D8" />
      <rect x="50" y="-10" width="10" height="20" fill="#f5f5f5" />
      <rect x="70" y="-15" width="15" height="25" fill="#f5f5f5" />
    </g>
    
    <!-- Paint drips on wall -->
    <path d="M200,50 Q205,70 210,50" fill="#00B4D8" />
    <path d="M200,100 Q205,120 210,100" fill="#00B4D8" />
    <path d="M200,150 Q205,170 210,150" fill="#00B4D8" />
    <path d="M200,200 Q205,220 210,200" fill="#00B4D8" />
  </g>
  
  <!-- Project label -->
  <rect x="50" y="360" width="500" height="30" fill="#0077B6" />
  <text x="300" y="382" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Office Space Renovation</text>
</svg>